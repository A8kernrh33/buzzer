<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09070b">
<title>Summon Piggy on your will 24/7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap');
*{box-sizing:border-box}
:root{--bg:#09070b;--panel:#141016;--panel2:#1b151e;--line:#352938;--accent:#ff4f91;--accent2:#ff8ab6;--text:#fff7fb;--muted:#b9aab5;--danger:#ff315f}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#4b1735 0,#1b0d19 28%,var(--bg) 62%);color:var(--text);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 47%,#ff4f9108 50%,transparent 53%)}
.card{position:relative;width:min(470px,94vw);padding:38px 30px 30px;text-align:center;background:linear-gradient(180deg,#19131b,#100c12);border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 100px #000b,0 0 70px #ff2f7212;overflow:hidden}
.card:before{content:"";position:absolute;left:10%;right:10%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 20px var(--accent)}
.crown{font-size:34px;margin-bottom:8px;filter:drop-shadow(0 0 12px #ff4f9166)}
.eyebrow{margin:0 0 10px;color:var(--accent2);font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
h1{margin:0;font-family:"Playfair Display",serif;font-size:clamp(31px,8vw,44px);line-height:1.05;letter-spacing:-.03em}
.subtitle{margin:14px auto 25px;max-width:390px;color:var(--muted);font-size:14px;line-height:1.65}
.subtitle strong{color:#fff}
.insult{margin:0 auto 22px;padding:15px 16px;border:1px solid #4a293b;border-radius:16px;background:#ff4f9109;color:#d9c9d2;font-size:13px;line-height:1.55}
.insult b{color:var(--accent2)}
label{display:block;text-align:left;margin:0 0 8px 4px;color:#9f8e9b;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
input{width:100%;padding:15px 16px;border:1px solid var(--line);outline:none;border-radius:14px;margin-bottom:14px;font:500 15px Inter,sans-serif;background:#0d0a0f;color:var(--text);transition:.2s}
input::placeholder{color:#665865}
input:focus{border-color:#9f4669;box-shadow:0 0 0 3px #ff4f9112}
input:invalid:not(:placeholder-shown){border-color:#8e294e}
button{position:relative;width:100%;padding:19px 18px;border:0;border-radius:15px;font:900 19px Inter,sans-serif;letter-spacing:.02em;cursor:pointer;background:linear-gradient(135deg,#ff3d83,#e92b65);color:#fff;box-shadow:0 12px 30px #ff2f5f30,0 3px 0 #a81949;transition:transform .12s,box-shadow .12s,filter .12s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 16px 38px #ff2f5f45,0 4px 0 #a81949}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 5px 16px #ff2f5f30,0 1px 0 #a81949}
button:disabled{opacity:.55;cursor:not-allowed}
#status{min-height:24px;margin-top:18px;color:#c8b8c2;font-size:13px;line-height:1.45;word-break:break-word}
.footer{margin-top:25px;padding-top:17px;border-top:1px solid #291f29;color:#655762;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.footer span{color:#907d89}
</style>
</head>
<body>
<main class="card">
  <div class="crown">♛</div>
  <p class="eyebrow">Her command center</p>
  <h1>Summon Piggy<br>on your will 24/7</h1>
  <p class="subtitle">The superior gives the command. <strong>The useless little pig responds.</strong></p>

  <div class="insult">No excuses. No hiding. No pretending you're important.<br><b>I'm here to be summoned.</b></div>

  <label for="name">Enter your name, Superior</label>
  <input id="name" maxlength="40" placeholder="Your name is required" autocomplete="name" required>
  <button id="buzz">♛ SUMMON PIGGY</button>
  <div id="status" aria-live="polite"></div>

  <div class="footer"><span>24/7 summon system</span> · awaiting your command</div>
</main>
<script>
const b=document.getElementById('buzz'),n=document.getElementById('name'),s=document.getElementById('status');
let localCooldown=false;

b.onclick=async()=>{
  const name=n.value.trim();
  if(!name){
    n.focus();
    s.textContent='⚠️ A superior must identify herself before issuing a summon.';
    return;
  }
  if(localCooldown) return;
  localCooldown=true;
  b.disabled=true;
  s.textContent='Your command is being delivered…';

  try{
    const r=await fetch('/api/buzz',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw Error(d.error||`Server returned HTTP ${r.status}`);

    if(d.mode==='queued'){
      s.textContent='♛ Command queued — the pig has already been summoned. Yours will be combined with it.';
    }else{
      s.textContent='♛ Summon sent. The pig has been called.';
    }
  }catch(e){
    s.textContent='❌ '+e.message;
    setTimeout(()=>{localCooldown=false;b.disabled=false},3000);
    return;
  }

  let remaining=10;
  const timer=setInterval(()=>{
    remaining--;
    if(remaining>0) s.textContent=`♛ Summon sent. You may summon again in ${remaining}s.`;
    else{
      clearInterval(timer);
      localCooldown=false;
      b.disabled=false;
      s.textContent='The command center is ready. Summon again.';
    }
  },1000);
};
</script>
</body>
</html>
