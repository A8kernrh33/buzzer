<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzz Me</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#111827;color:#fff}
.card{width:min(420px,90vw);padding:32px;text-align:center;background:#1f2937;border-radius:24px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;font-size:32px}p{color:#cbd5e1;margin:0 0 24px}
input{width:100%;padding:14px;border:0;border-radius:12px;margin-bottom:14px;font-size:16px}
button{width:100%;padding:20px;border:0;border-radius:16px;font-size:22px;font-weight:800;cursor:pointer;background:#f59e0b;color:#111827}
button:disabled{opacity:.6;cursor:not-allowed}
#status{min-height:24px;margin-top:18px;color:#cbd5e1;word-break:break-word}
</style>
</head>
<body>
<main class="card">
<h1>🔔 Buzz Me</h1>
<p>Press the button to get their attention.</p>
<input id="name" maxlength="40" placeholder="Your name (optional)">
<button id="buzz">🔔 BUZZ</button>
<div id="status"></div>
</main>
<script>
const b=document.getElementById('buzz'),n=document.getElementById('name'),s=document.getElementById('status');
let localCooldown=false;

b.onclick=async()=>{
  if(localCooldown) return;
  localCooldown=true;
  b.disabled=true;
  s.textContent='Sending…';

  try{
    const r=await fetch('/api/buzz',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:n.value.trim()||'Someone'})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw Error(d.error||`Server returned HTTP ${r.status}`);

    if(d.mode==='queued'){
      s.textContent=`🔔 Buzz queued — another buzz was just sent. I'll combine yours with it.`;
    }else{
      s.textContent='🔔 Buzz sent!';
    }
  }catch(e){
    s.textContent='❌ '+e.message;
    // Allow retry after a short failure cooldown.
    setTimeout(()=>{localCooldown=false;b.disabled=false},3000);
    return;
  }

  // Prevent accidental double taps for 10 seconds.
  let remaining=10;
  const timer=setInterval(()=>{
    remaining--;
    if(remaining>0) s.textContent=`🔔 Buzz sent! You can buzz again in ${remaining}s.`;
    else{
      clearInterval(timer);
      localCooldown=false;
      b.disabled=false;
      s.textContent='Ready to buzz again.';
    }
  },1000);
};
</script>
</body>
</html>
