<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzz Me</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#111827;color:#fff}
.card{width:min(420px,90vw);padding:32px;text-align:center;background:#1f2937;border-radius:24px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;font-size:32px} p{color:#cbd5e1;margin:0 0 24px}
input{width:100%;padding:14px;border:0;border-radius:12px;margin-bottom:14px;font-size:16px}
button{width:100%;padding:20px;border:0;border-radius:16px;font-size:22px;font-weight:800;cursor:pointer;background:#f59e0b;color:#111827}
button:disabled{opacity:.6;cursor:wait}
#status{min-height:24px;margin-top:18px;color:#cbd5e1}
</style>
</head>
<body>
<main class="card">
<h1>🔔 Buzz Me</h1>
<p>Press the button to get their attention.</p>
<input id="name" maxlength="40" placeholder="Your name (optional)">
<button id="buzz">🔔 BUZZ</button>
<div id="status"></div>
</main>
<script>
const button=document.getElementById("buzz");
const nameInput=document.getElementById("name");
const status=document.getElementById("status");
button.addEventListener("click",async()=>{
  button.disabled=true; status.textContent="Sending…";
  const name=nameInput.value.trim()||"Someone";
  try{
    const r=await fetch("/.netlify/functions/buzz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||"Request failed");
    status.textContent="🔔 Buzz sent!";
  }catch(e){status.textContent="Couldn't send the buzz. Try again.";}
  finally{setTimeout(()=>button.disabled=false,2500);}
});
</script>
</body>
</html>
